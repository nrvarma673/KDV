<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Krishna's Life Journey</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="nav-bar">
    <div class="brand"><span class="badge">KDV</span> Krishna's Life Journey</div>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="timeline.html">Timeline</a>
    </nav>
    <div id="nav-auth-area"></div>
  </div>
</header>

<div class="container">
  <div class="card form-card">
    <h2 style="margin-top:0;">My Account</h2>
    <p class="hint" style="margin-top:0;">Logged in as <strong id="account-email"></strong></p>

    <form id="account-change-password-form">
      <div class="form-group">
        <label for="account-new-password">New password (min. 8 characters)</label>
        <input type="password" id="account-new-password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="account-confirm-password">Confirm new password</label>
        <input type="password" id="account-confirm-password" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Update Password</button>
      <div id="account-msg" class="form-msg" style="display:none;"></div>
    </form>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    &copy; <span id="footer-year"></span> Krishna's Life Journey — a private family project.
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById("footer-year").textContent = new Date().getFullYear();
initAuthNav();

requireAuth((user) => {
  document.getElementById("account-email").textContent = user.email;
});

document.getElementById("account-change-password-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const pw1 = document.getElementById("account-new-password").value;
  const pw2 = document.getElementById("account-confirm-password").value;
  const msg = document.getElementById("account-msg");

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = "form-msg " + type;
    msg.style.display = "block";
  }

  if (pw1.length < 8) { showMsg("Password must be at least 8 characters.", "error"); return; }
  if (pw1 !== pw2) { showMsg("Passwords do not match.", "error"); return; }

  const user = auth.currentUser;
  user.updatePassword(pw1)
    .then(() => {
      showMsg("Password updated successfully.", "success");
      e.target.reset();
    })
    .catch((err) => {
      if (err.code === "auth/requires-recent-login") {
        showMsg("For security, please log out and log back in, then try again immediately.", "error");
      } else {
        showMsg("Could not update password: " + err.message, "error");
      }
    });
});
</script>
</body>
</html>
