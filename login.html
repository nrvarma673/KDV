<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Login — Krishna's Life Journey</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="nav-bar">
    <div class="brand"><span class="badge">KDV</span> Krishna's Life Journey</div>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="timeline.html">Timeline</a>
    </nav>
    <div id="nav-auth-area"></div>
  </div>
</header>

<div class="container">
  <div class="card form-card">
    <div style="width:44px;height:44px;border-radius:12px;background:var(--color-primary-light);color:var(--color-primary);display:flex;align-items:center;justify-content:center;margin-bottom:18px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h2 style="margin-top:0;">Family Login</h2>
    <p class="hint" style="margin-top:0;">Log in to view and add to Krishna's photo timeline.</p>

    <form id="login-form">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
      <div id="login-msg" class="form-msg" style="display:none;"></div>
    </form>

    <p class="center-note">
      <a href="#" id="forgot-link">Forgot password?</a>
    </p>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    &copy; <span id="footer-year"></span> Krishna's Life Journey — a private family project.
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById("footer-year").textContent = new Date().getFullYear();
initAuthNav();

// If already logged in, go straight to the right place for their role.
auth.onAuthStateChanged((user) => {
  if (user) {
    checkIsAdmin(user).then((isAdmin) => {
      window.location.href = isAdmin ? "admin.html" : "timeline.html";
    });
  }
});

document.getElementById("login-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const msg = document.getElementById("login-msg");

  auth.signInWithEmailAndPassword(email, password)
    .then((cred) => checkIsAdmin(cred.user))
    .then((isAdmin) => {
      window.location.href = isAdmin ? "admin.html" : "timeline.html";
    })
    .catch((err) => {
      msg.textContent = "Login failed: " + err.message;
      msg.className = "form-msg error";
      msg.style.display = "block";
    });
});

document.getElementById("forgot-link").addEventListener("click", (e) => {
  e.preventDefault();
  const email = document.getElementById("login-email").value.trim();
  const msg = document.getElementById("login-msg");
  if (!email) {
    msg.textContent = "Enter your email above first, then click 'Forgot password?' again.";
    msg.className = "form-msg info";
    msg.style.display = "block";
    return;
  }
  auth.sendPasswordResetEmail(email)
    .then(() => {
      msg.textContent = "Password reset email sent to " + email + ".";
      msg.className = "form-msg success";
      msg.style.display = "block";
    })
    .catch((err) => {
      msg.textContent = "Could not send reset email: " + err.message;
      msg.className = "form-msg error";
      msg.style.display = "block";
    });
});
</script>
</body>
</html>
